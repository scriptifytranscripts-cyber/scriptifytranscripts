<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Symmetrical S Soundwave / Transcript Waveform Icon -->
  <g transform="translate(14, 16)">
    <!-- Document outline subtle -->
    <rect x="10" y="8" width="80" height="80" rx="14" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>
    
    <!-- Modern Soundwave Bars representing S shape and audio transcript -->
    <rect x="22" y="38" width="6" height="20" rx="3" fill="#22d3ee" />
    <rect x="32" y="26" width="6" height="44" rx="3" fill="#06b6d4" />
    <rect x="42" y="16" width="6" height="64" rx="3" fill="url(#brandGrad)" />
    <rect x="52" y="24" width="6" height="48" rx="3" fill="#3b82f6" />
    <rect x="62" y="32" width="6" height="32" rx="3" fill="#6366f1" />
    <rect x="72" y="42" width="6" height="12" rx="3" fill="#8b5cf6" />
  </g>
</svg>
